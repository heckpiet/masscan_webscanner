[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masscan-webscanner"
version = "2.0.0"
description = "Archive HTML and screenshots from authorized web services discovered by masscan"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "MechanicalSoup>=1.3,<2",
  "selenium>=4.18,<5",
  "urllib3>=2,<3",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
masscan-webscanner = "masscan_webscanner:main"

[tool.setuptools]
py-modules = ["masscan_webscanner"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
