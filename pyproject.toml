[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masscan-webscanner"
version = "2.2.1"
description = "Safely inventory authorized web services discovered by masscan"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "heckpiet" }]
keywords = ["masscan", "network-scanner", "security", "selenium"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.32,<3",
]

[project.urls]
Homepage = "https://github.com/heckpiet/masscan_webscanner"
Issues = "https://github.com/heckpiet/masscan_webscanner/issues"
Changelog = "https://github.com/heckpiet/masscan_webscanner/blob/main/CHANGELOG.md"

[project.optional-dependencies]
screenshots = ["selenium>=4.18,<5"]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "twine>=6,<8",
]

[project.scripts]
masscan-webscanner = "masscan_webscanner:main"

[tool.setuptools]
py-modules = ["masscan_webscanner"]

[tool.pytest.ini_options]
addopts = "-ra --cov=masscan_webscanner --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
